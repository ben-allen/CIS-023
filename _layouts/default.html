<!DOCTYPE html>

<!-- 
  A NOTE TO STUDENTS: you can safely ignore this file, and everything else in this directory. It changes the styling of rendered pages from this repository when the page is embedded in a Canvas page. Additionally, it makes the links on pages open in a new tab when you click on them from the embedded Canvas version -- this is necessary because browsers often complain about putting an external link in an `iframe`.
-->

<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('embedded');
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('a[href]').forEach(function (a) {
          if (a.getAttribute('href').startsWith('#')) return; // keep same-page jumps in the frame
          a.target = '_blank';
          a.rel = 'noopener';
        });
      });
    }
  </script>
    <style>
      .embedded .site-title { display: none; }
    </style>

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1 class="site-title"><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
      {% endif %}

      {{ content }}

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
